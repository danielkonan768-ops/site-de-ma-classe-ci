<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b4f8a">
<title>MA CLASSE CI 🇨🇮</title>
<style>
:root{--blue:#0b4f8a;--blue2:#0f6fb7;--navy:#082f55;--sky:#eaf5ff;--muted:#63758a;--line:#dce8f2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#10233a;background:#f7fbff}
a{text-decoration:none}
.container{width:min(1120px,92%);margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;color:var(--navy);font-weight:900}
.brand img{width:52px;height:52px;object-fit:contain;display:block}
.brand small{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.7px}
.nav-links{display:flex;gap:22px;font-size:14px;font-weight:700}
.nav-links a{color:#476078}
.nav-btn,.primary{background:var(--blue);color:#fff;border-radius:15px;font-weight:900}
.nav-btn{padding:12px 18px}
.hero{padding:75px 0 55px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}
.badge{display:inline-block;padding:9px 14px;border-radius:999px;background:var(--sky);color:var(--blue);font-size:13px;font-weight:900}
